name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Run Wesnoth Android Build Script
      run: |
        cd packaging/android
        chmod +x build.sh || true
        ./build.sh --release || ./build.sh || true

    - name: Find and Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: battle-of-realms-apks
        path: |
          packaging/android/app/build/outputs/apk/**/*.apk
          packaging/android/build/**/*.apk
